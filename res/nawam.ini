;; Nawam portable settings template.
;; Copy this file beside Nawam.exe and name it nawam.ini.
;; An empty nawam.ini also enables portable mode; no separate EXE is needed.
;; Settings are stored here rather than Rufus's registry/configuration.
;; Remove Locale to use the Windows UI language, or set it to id-ID.
Locale = en-US
;; Application updates are compile-time disabled regardless of these values.
UpdateCheckInterval = -1
CheckForBetas = 0
;; Safety defaults: no extra hard disks and no destructive automation enabled.
;; Other upstream setting names remain compatible; see src/settings.h.
